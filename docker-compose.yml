version: '3.8'
services:
  telemetry-broker:
    image: redis:alpine
    container_name: lava-redis-bus
    # Expose Redis to the host's private network IP for direct access from VMs
    # and the host for CRIU migration scenarios.
    ports:
      - "6379:6379" # Bind to k8s-master's private IP
    networks:
      neuromorphic_mesh:
        ipv4_address: 10.0.0.5 # Internal Docker IP

  snn-workload:
    build:
      context: .
      dockerfile: Dockerfile.snn_workload
    container_name: lava-snn-workload
    networks:
      neuromorphic_mesh:
        ipv4_address: 10.0.0.6 # Assign a unique IP within the subnet
    depends_on:
      - telemetry-broker # Ensure Redis is up before SNN starts
    restart: on-failure # Restart if the SNN workload crashes

networks:
  neuromorphic_mesh:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
    ipam:
      config:
        - subnet: 10.0.0.0/24
